# Tier 3 audit stack (audit pipeline only — no UserSync).
# Equivalent to:
#   docker compose \
#     -f docker-compose.ranger.yml \
#     -f docker-compose.ranger-kafka.yml \
#     -f docker-compose.ranger-hadoop.yml \
#     -f docker-compose.ranger-audit-ingestor.yml \
#     -f docker-compose.ranger-audit-dispatcher-solr.yml \
#     up -d --build
#
# Optional UserSync: add -f docker-compose.ranger-usersync.yml
#
# One command: ./setup-audit-e2e.sh
# Docs: README-AUDIT-E2E.md

include:
  - path: docker-compose.ranger.yml
  - path: docker-compose.ranger-kafka.yml
  - path: docker-compose.ranger-hadoop.yml
  - path: docker-compose.ranger-audit-ingestor.yml
  - path: docker-compose.ranger-audit-dispatcher-solr.yml
